<!--
  Mini scene: sample finding, Hidden costs at checkout (teal).
  Family 5 in docs/GRAPHICS.md (257 x 200): dark base, two glows in one hue
  family, one white card showing the finding in a single moment, flagged
  with the red dashed outline and marker. Illustrative.
-->
<div class="ux-scene ux-scene--mini" role="img" aria-label="Illustrative checkout summary where an 18 dollar shipping fee appears only at the last step, flagged as a finding.">
<svg viewBox="0 0 257 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <filter id="ux-mf-checkout-blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="24"/></filter>
    <linearGradient id="ux-mf-checkout-bg" x1="58" y1="-3" x2="147" y2="191" gradientUnits="userSpaceOnUse"><stop stop-color="#0F1F3D"/><stop offset="1" stop-color="#070D1C"/></linearGradient>
    <clipPath id="ux-mf-checkout-clip"><rect width="257" height="200" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#ux-mf-checkout-clip)">
    <rect width="257" height="200" fill="url(#ux-mf-checkout-bg)"/>
    <ellipse cx="60" cy="175" rx="100" ry="75" fill="#0F9A96" fill-opacity="0.75" filter="url(#ux-mf-checkout-blur)"/>
    <ellipse cx="240" cy="5" rx="70" ry="55" fill="#14B8A6" fill-opacity="0.4" filter="url(#ux-mf-checkout-blur)"/>
    <rect x="23" y="24.8" width="211" height="150.1" rx="12" fill="#FFFFFF"/>
    <text class="ux-scene__h" x="37" y="48" font-size="11" fill="#0A1B33">Order summary</text>
    <text class="ux-scene__b" x="207" y="48" font-size="7" fill="#6F7680" text-anchor="end">Step 3 of 3</text>
    <g class="ux-scene__b" font-size="8.5" fill="#374151"><text x="37" y="72">Subtotal</text><text x="37" y="96">Shipping</text></g>
    <g class="ux-scene__b" font-size="8.5" fill="#374151" text-anchor="end"><text x="220" y="72">$249.00</text></g>
    <text class="ux-scene__bb" x="220" y="96" font-size="8.5" fill="#C62F35" text-anchor="end">+ $18.00</text>
    <rect x="31" y="84" width="195" height="18" rx="6" fill="#E5484D" fill-opacity="0.05" stroke="#E5484D" stroke-width="1" stroke-dasharray="3.5 2.5"/>
    <rect x="37" y="110" width="183" height="0.8" fill="#E6EAEE"/>
    <text class="ux-scene__bb" x="37" y="127" font-size="9" fill="#0A1B33">Total</text>
    <text class="ux-scene__bb" x="220" y="127" font-size="9" fill="#0A1B33" text-anchor="end">$267.00</text>
    <rect x="37" y="140" width="183" height="22" rx="5.6" fill="#0A1B33"/>
    <text class="ux-scene__bb" x="128.5" y="154" font-size="8" fill="#FFFFFF" text-anchor="middle">Pay now</text>
    <circle class="ux-scene__pulse" cx="226" cy="84" r="11" fill="#C62F35" fill-opacity="0.3"/>
    <circle cx="226" cy="84" r="6.5" fill="#C62F35" stroke="#FFFFFF" stroke-width="1"/>
    <text class="ux-scene__bb" x="226" y="86.7" font-size="7.5" fill="#FFFFFF" text-anchor="middle">!</text>
  </g>
</svg>
</div>
