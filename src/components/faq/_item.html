<!-- FAQ item partial. Params: q, a, open ("is-open" to start open) -->
<div class="ux-faq__item {{open}}">
  <h3 class="ux-faq__heading"><button class="ux-faq__question" type="button">{{q}}<span class="ux-faq__icon" aria-hidden="true"></span></button></h3>
  <div class="ux-faq__panel"><p class="ux-faq__answer">{{a|Add answer here.}}</p></div>
</div>
