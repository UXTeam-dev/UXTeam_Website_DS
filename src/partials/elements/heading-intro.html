<!--
  Section heading block with a short intro line under the H2 (What we do).
  Params: sub, title, intro, underline (sky-blue | white), white (uxt-white | empty),
          size (uxt-p-sm for an 18px intro, empty for 20px)
-->
<div class="uxt-heading">
  <p class="uxt-subheading underline-{{underline|sky-blue}} {{white|}}">{{sub}}</p>
  <h2 class="uxt-h2 {{white|}}">{{title}}</h2>
  <p class="uxt-p {{size|}} {{white|}}">{{intro}}</p>
</div>
