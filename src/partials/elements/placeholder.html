<!--
  Labeled image placeholder (PART S, works anywhere). Use wherever a client
  mockup, screenshot, photo or cover is needed and was not supplied. Never
  generate or fake one. List every placeholder in docs/OPEN-ITEMS.md.
  Params:
    label  what goes here, e.g. "Client dashboard screenshot, 1200 x 800"
    ratio  empty (3:2) | uxt-placeholder-square | uxt-placeholder-wide | uxt-placeholder-tall
-->
<div class="uxt-placeholder {{ratio|}}" role="img" aria-label="Image to come: {{label}}">
  <p class="uxt-p uxt-p-xs uxt-placeholder-label">[Image: {{label}}]</p>
</div>
