<!--
  Section heading block: subheading (eyebrow) + H2. PART B (.uxt-heading, .uxt-subheading).
  Params:
    sub        subheading text (always present)
    title      H2 text
    underline  sky-blue (light sections) | white (dark sections)
    white      uxt-white on dark sections, empty on light
-->
<div class="uxt-heading">
  <p class="uxt-subheading underline-{{underline|sky-blue}} {{white|}}">{{sub}}</p>
  <h2 class="uxt-h2 {{white|}}">{{title}}</h2>
</div>
