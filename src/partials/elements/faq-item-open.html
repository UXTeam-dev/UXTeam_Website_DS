<!--
  The FAQ question that starts open (one per page). Params: n, q, a
-->
<div class="uxt-faq-item is-expanded">
  <button type="button" class="uxt-faq-question" aria-controls="uxt-faq-answer-{{n}}" aria-expanded="true"><h3 class="uxt-h3-sm">{{q}}</h3><span class="uxt-faq-icon"></span></button>
  <div class="uxt-faq-panel" id="uxt-faq-answer-{{n}}"><div class="uxt-faq-panel-inner"><p class="uxt-p uxt-p-sm">{{a}}</p></div></div>
</div>
